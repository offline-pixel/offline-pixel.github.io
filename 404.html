        <style>
            .progress-bar-fill {
                transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .hidden {
                display: none !important;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .animate-in {
                animation: fadeIn 0.4s ease-out forwards;
            }
            .search-dropdown {
                max-height: 300px;
                overflow-y: auto;
                scrollbar-width: thin;
            }
            .search-dropdown::-webkit-scrollbar {
                width: 4px;
            }
            .search-dropdown::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 4px;
            }
            .search-dropdown::-webkit-scrollbar-track {
                background: transparent;
            }
            .search-highlight {
                background: #dbeafe;
                font-weight: 600;
            }
            .dark .search-highlight {
                background: #1e3a5f;
                color: #93c5fd;
            }
            @media (min-width: 768px) {
                .popular-links-grid {
                    display: grid;
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(140px, 1fr)
                    );
                    gap: 0.375rem;
                }
            }
        </style>
    </head>

        <!-- Error UI -->

                <!-- Search -->

                            autocomplete="off"
                        />
                    </div>
                    <div
                        id="search-results"
                        class="search-dropdown absolute left-0 right-0 mt-1 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 hidden max-h-72 overflow-y-auto z-10"
                    ></div>
                </div>

                <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">
                    Or browse popular articles:
                </p>

                    class="flex flex-wrap justify-center gap-1.5 mb-4 popular-links-grid"

                },

                    label: "Ultimate Oscillator",
                },
                {

                    label: "Volume Oscillator",
                },

                    label: "Volume-Adjusted RSI",
                },
                {
                    slug: "pine-script-volume-price-trend",
                    label: "Volume Price Trend",
                },
                { slug: "pine-script-volume-roc", label: "Volume ROC" },
                {
                    slug: "pine-script-volume-weighted-macd",
                    label: "Volume-Weighted MACD",
                },
                {
                    slug: "pine-script-vortex-indicator",
                    label: "Vortex Indicator",
                },
                { slug: "pine-script-vwma", label: "VWMA" },
                { slug: "pine-script-williams-r", label: "Williams %R" },
                { slug: "pine-script-woodie-pivots", label: "Woodie Pivots" },
                { slug: "pine-script-zlema", label: "ZLEMA" },
            ];

            const ALL_SLUGS = ALL_ARTICLES.map((a) => a.slug);
            const SPECIAL_CASES = {
                "pine-script-volume-profile": "pine-script-volumeprofile/",
                "pine-script-super-trend": "pine-script-supertrend/",
                "pine-script-c-c-i": "pine-script-cci/",
                "pine-script-anchored-v-w-a-p": "pine-script-anchored-vwap/",
                "pine-script-c-m-o": "pine-script-cmo/",
            };

            // Build popular links
            const container = document.getElementById("popular-links");
            ALL_ARTICLES.forEach((article) => {
                const a = document.createElement("a");
                a.href = `/pinescript-strategies/${article.slug}/`;
                a.className =
                    "bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-3 py-1.5 rounded-lg text-xs transition-colors duration-200 text-gray-800 dark:text-gray-200 text-center";
                a.textContent = article.label;
                container.appendChild(a);
            });

            // Search functionality
            const searchInput = document.getElementById("search-input");
            const searchResults = document.getElementById("search-results");

            function highlightText(text, query) {
                const regex = new RegExp(
                    `(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`,
                    "gi",
                );
                return text.replace(
                    regex,
                    '<span class="search-highlight">$1</span>',
                );
            }

            function performSearch(query) {
                const trimmed = query.trim().toLowerCase();
                if (trimmed.length < 3) {
                    searchResults.classList.add("hidden");
                    return;
                }

                const results = ALL_ARTICLES.filter(
                    (article) =>
                        article.label.toLowerCase().includes(trimmed) ||
                        article.slug.toLowerCase().includes(trimmed),
                );

                if (results.length === 0) {
                    searchResults.innerHTML = `
                        <div class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400 text-center">
                            <i class="fas fa-search mr-2"></i>No articles found
                        </div>
                    `;
                    searchResults.classList.remove("hidden");
                    return;
                }

                searchResults.innerHTML = results
                    .map(
                        (article) => `
                    <a href="/pinescript-strategies/${article.slug}/"
                       class="flex items-center justify-between px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-150 border-b border-gray-100 dark:border-gray-700 last:border-0">
                        <span class="text-sm text-gray-800 dark:text-gray-200">${highlightText(article.label, trimmed)}</span>
                        <i class="fas fa-arrow-right text-xs text-gray-400 dark:text-gray-500"></i>
                    </a>
                `,
                    )
                    .join("");

                searchResults.classList.remove("hidden");
            }

            searchInput.addEventListener("input", function (e) {
                performSearch(e.target.value);
            });

            searchInput.addEventListener("focus", function () {
                if (this.value.trim().length >= 3) {
                    performSearch(this.value);
                }
            });

            document.addEventListener("click", function (e) {
                if (
                    !e.target.closest("#search-input") &&
                    !e.target.closest("#search-results")
                ) {
                    searchResults.classList.add("hidden");
                }
            });

            searchInput.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    searchResults.classList.add("hidden");
                    this.blur();
                }
            });

            // Redirect logic
            const path = window.location.pathname;

            if (
                path ===
                "/migration-guides/electron-to-tauri-migration-framework"
            ) {
                executeRedirect(
                    "/migration-guides/electron-to-tauri-migration/",
                );
            }

            if (path.includes("/pinescript-strategies/")) {
                let rawSlug = path.split("/").pop().replace(".html", "");
                let normalized = rawSlug
                    .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
                    .toLowerCase();
                if (!normalized.startsWith("pine-script-")) {
                    normalized =
                        "pine-script-" + normalized.replace("pine-script-", "");
                }

                if (ALL_SLUGS.includes(normalized)) {
                    executeRedirect(`/pinescript-strategies/${normalized}/`);
                } else if (SPECIAL_CASES[normalized]) {
                    executeRedirect(SPECIAL_CASES[normalized]);
                }
            }

            function executeRedirect(targetUrl) {
                document.getElementById("error-ui").style.display = "none";
                document
                    .getElementById("redirect-ui")
                    .classList.remove("hidden");

                setTimeout(() => {
                    document.getElementById("fill").style.width = "100%";
                }, 100);

                setTimeout(() => {
                    window.location.replace(targetUrl);
                }, 1600);
            }
        </script>
