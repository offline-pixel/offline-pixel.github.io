<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Redirecting - Offline Pixel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f9fafb;
            }
            .container {
                text-align: center;
                padding: 2rem;
            }
            .progress-bar-container {
                width: 100%;
                max-width: 300px;
                height: 6px;
                background: #e5e7eb;
                border-radius: 3px;
                overflow: hidden;
                margin: 20px auto;
            }
            .progress-bar-fill {
                height: 100%;
                background: #2563eb;
                width: 0%;
                transition: width 1.5s linear;
            }
            .hidden {
                display: none;
            }
            h1 {
                font-size: 1.5rem;
                color: #1f2937;
            }
            .error-code {
                font-size: 5rem;
                font-weight: 900;
                color: #2563eb;
                margin-bottom: 1rem;
            }
            a {
                color: #2563eb;
                text-decoration: none;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div id="redirect-ui" class="container hidden">
            <h1>Redirecting to your article...</h1>
            <div class="progress-bar-container">
                <div id="fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="error-ui" class="container">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you are looking for does not exist.</p>
            <a href="/">← Back to Homepage</a>
        </div>

        <script>
            const ALLOWED_SLUGS = [
                "pine-script-vwap-daily",
                "pine-script-atr",
                "pine-script-bollinger-bands",
                "pine-script-ema",
                "pine-script-engulfing",
                "pine-script-fibonacci-retracements",
                "pine-script-gann-square-of-nine",
                "pine-script-ichimoku-cloud",
                "pine-script-obv",
                "pine-script-parabolic-sar",
                "pine-script-pivot-points",
                "pine-script-rsi",
                "pine-script-stochastic",
                "pine-script-supertrend",
                "pine-script-volumeprofile",
            ];

            const path = window.location.pathname;
            console.log("Current Path:", path);
            if (
                path ===
                "/migration-guides/electron-to-tauri-migration-framework"
            ) {
                executeRedirect(
                    "/migration-guides/electron-to-tauri-migration",
                );
            }
            // 1. Normalize and validate
            if (path.includes("/pinescript-strategies/")) {
                let rawSlug = path.split("/").pop().replace(".html", "");

                // Convert CamelCase to kebab-case: e.g., BollingerBands -> bollinger-bands
                let normalized = rawSlug
                    .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
                    .toLowerCase();

                // Ensure prefix
                if (!normalized.startsWith("pine-script-")) {
                    normalized =
                        "pine-script-" + normalized.replace("pine-script-", "");
                }

                console.log("Extracted Raw Slug:", rawSlug);
                console.log("Normalized Slug:", normalized);

                if (ALLOWED_SLUGS.includes(normalized)) {
                    console.log("Match found! Redirecting to:", normalized);
                    executeRedirect(`/pinescript-strategies/${normalized}`);
                } else {
                    if (normalized == "pine-script-volume-profile") {
                        executeRedirect("pine-script-volumeprofile");
                    }
                    console.warn(
                        "No match found in ALLOWED_SLUGS for:",
                        normalized,
                    );
                }
            }

            function executeRedirect(targetUrl) {
                document.getElementById("error-ui").style.display = "none";
                document
                    .getElementById("redirect-ui")
                    .classList.remove("hidden");

                setTimeout(() => {
                    document.getElementById("fill").style.width = "100%";
                }, 100);

                setTimeout(() => {
                    window.location.replace(targetUrl);
                }, 1600);
            }
        </script>
    </body>
</html>
