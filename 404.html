<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Redirecting... - Offline Pixel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            .progress-bar-container {
                width: 100%;
                max-width: 300px;
                height: 4px;
                background: #e5e7eb;
                border-radius: 2px;
                overflow: hidden;
                margin: 20px auto;
            }
            .progress-bar-fill {
                height: 100%;
                background: #2563eb;
                width: 0%;
                transition: width 1.5s linear;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex items-center justify-center min-h-screen">
        <div id="redirect-ui" class="hidden text-center p-6">
            <h1 class="text-xl font-bold text-gray-800">
                Redirecting to your article...
            </h1>
            <div class="progress-bar-container">
                <div id="fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="error-ui" class="max-w-2xl mx-auto px-4 py-8 text-center">
            <div class="text-blue-600 text-7xl font-black mb-4">404</div>
            <h1 class="text-2xl font-bold text-gray-800">Page Not Found</h1>
            <p class="text-gray-600 mt-2">
                The page you are looking for does not exist.
            </p>
            <a href="/" class="mt-6 inline-block text-blue-600 font-medium"
                >← Back to Homepage</a
            >
        </div>

        <script>
            const ALLOWED_SLUGS = [
                "pine-script-vwap-daily",
                "pine-script-atr",
                "pine-script-bollinger-bands",
                "pine-script-ema",
                "pine-script-engulfing",
                "pine-script-fibonacci-retracements",
                "pine-script-gann-square-of-nine",
                "pine-script-ichimoku-cloud",
                "pine-script-obv",
                "pine-script-parabolic-sar",
                "pine-script-pivot-points",
                "pine-script-rsi",
                "pine-script-stochastic",
                "pine-script-supertrend",
                "pine-script-volumeprofile",
            ];

            const path = window.location.pathname;

            // Strict pattern check: /pinescript-strategies/pine-script-****.html
            if (
                path.startsWith("/pinescript-strategies/pine-script-") &&
                path.endsWith(".html")
            ) {
                let slug = path.split("/").pop().replace(".html", "");

                // Handle volume profile exception
                if (slug === "pine-script-volumeprofile") {
                    executeRedirect(
                        "/pinescript-strategies/pine-script-volumeprofile",
                    );
                }
                // Check against allowed list
                else if (ALLOWED_SLUGS.includes(slug)) {
                    executeRedirect(`/pinescript-strategies/${slug}`);
                }
            }

            function executeRedirect(targetUrl) {
                document.getElementById("error-ui").style.display = "none";
                document.getElementById("redirect-ui").style.display = "block";

                // Start progress animation
                setTimeout(() => {
                    document.getElementById("fill").style.width = "100%";
                }, 100);

                // Redirect after 1.6 seconds
                setTimeout(() => {
                    window.location.replace(targetUrl);
                }, 1600);
            }
        </script>
    </body>
</html>
